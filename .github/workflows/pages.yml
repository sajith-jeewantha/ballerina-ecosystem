name: Publish graph viewer

on:
  push:
    branches: [main]
    paths:
      - "ballerina-graph/build/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Use viewer as the home page
        run: cp ballerina-graph/build/viewer.html ballerina-graph/build/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ballerina-graph/build
      - id: deployment
        uses: actions/deploy-pages@v4
