schema_version: "0.1"
id: concept.configurable
type: concept
title: Configurable variables
summary: Module-level variables declared `configurable` whose values can be supplied by a configuration when the program is run.
priority: important
status: draft
sources:
  - {url: "https://ballerina.io/spec/lang/2024R1/#section_8.7", kind: spec, note: "8.7 Module variable declaration"}
  - {url: "https://ballerina.io/spec/lang/2024R1/#section_8.2", kind: spec, note: "8.2 Module and program execution (configuration)"}
must_cover:
  - id: declare_configurable
    text: "Declare a configurable module variable such as `configurable int port = 8080;`, whose initializer is used only when no value is supplied; if a value is supplied when the program is run, the initializer expression is not evaluated"
    difficulty: [beginner]
  - id: required_configurable
    text: "Use `configurable string password = ?;` to require that the configuration supply a value, knowing a `?` initializer is allowed only with `configurable`"
    difficulty: [beginner]
  - id: explicit_type
    text: "Explain that a configurable declaration must use an explicit type descriptor rather than `var`, its binding pattern must be just a variable name, and the type must be a subtype of `anydata`"
    difficulty: [intermediate]
  - id: final_and_readonly
    text: "Explain that a configurable variable is implicitly final and cannot be assigned outside its declaration, and that its static type is the declared type intersected with `readonly`"
    difficulty: [intermediate]
  - id: quals_exclusive
    text: "Recognize that `configurable` is used on its own in the module variable qualifiers: it cannot be combined with `final` or `isolated`"
    difficulty: [intermediate]
  - id: isolated_access
    text: "Reference configurable variables from `isolated` functions, which is always allowed because a configurable variable is final and its type is a subtype of `readonly`"
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/spec/lang/2024R1/#isolated_functions", kind: spec, note: "7.3.5 Isolated functions"}
  - id: configuration_check
    text: "Explain that a configuration maps configurable variable names to values of type `anydata & readonly`, and that before any module is initialized the initialization phase checks that every required configurable variable has a value of the correct type, terminating unsuccessfully otherwise"
    difficulty: [intermediate]
out_of_scope:
  - "Configuration file formats and command-line overrides (platform-defined, e.g. Config.toml)"
  - "Other module variable forms (concept.variables)"
edges:
  - {to: concept.variables, rel: requires}
  - {to: concept.json_anydata, rel: uses, via: [explicit_type]}
  - {to: concept.mutability_readonly, rel: uses, via: [final_and_readonly]}
  - {to: concept.isolation, rel: uses, via: [isolated_access]}
  - {to: concept.program_execution, rel: related, via: [configuration_check], target_items: [two_phases]}
notes: "8.7 says that with `var` the precise type is used 'if the module-var-decl includes final or configurable', yet a configurable declaration may not use `var`; the configurable half of that sentence appears vacuous. The format in which the configuration is supplied is not defined by the spec."
