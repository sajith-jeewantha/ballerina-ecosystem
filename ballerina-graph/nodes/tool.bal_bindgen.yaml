schema_version: '0.1'
id: tool.bal_bindgen
type: tool
title: bal bindgen
summary: The `bal bindgen` CLI tool generates Ballerina binding classes and functions for Java classes, built on `ballerina/jballerina.java` interop, so a Ballerina program can call Java libraries without writing the FFI layer by hand.
priority: long_tail
status: draft
sources:
- {url: 'https://ballerina.io/learn/the-bindgen-tool/', kind: docs, note: The Bindgen tool}
- {url: 'https://ballerina.io/learn/call-java-code-from-ballerina/', kind: docs, note: Call Java code from Ballerina (SnakeYAML walkthrough)}
must_cover:
- id: generate_with_classpath
  text: Generate bindings with `bal bindgen [-cp <jar-or-dir>,...] <fully.qualified.ClassName>...`, listing the class names last; no classpath is needed for standard Java libraries, libraries in the Ballerina SDK or platform libraries already declared in `Ballerina.toml`
  difficulty: [beginner]
- id: maven_dependency
  text: Use `-mvn <groupId>:<artifactId>:<version>` (e.g. `bal bindgen -mvn org.yaml:snakeyaml:1.25 org.yaml.snakeyaml.Yaml java.io.FileInputStream`) to resolve a library and its transitive dependencies into `target/platform-libs` and add them to `Ballerina.toml` as platform libraries
  difficulty: [intermediate]
  sources:
  - {url: 'https://ballerina.io/learn/the-bindgen-tool/', kind: docs}
  - {url: 'https://ballerina.io/learn/call-java-code-from-ballerina/', kind: docs}
- id: output_layout
  text: Import the generated modules (one per Java package by default, e.g. `import yaml_package.java.io as javaio;`), or put all bindings in one directory with `-o <path>` and make them public with `--public`
  difficulty: [intermediate]
  sources:
  - {url: 'https://ballerina.io/learn/the-bindgen-tool/', kind: docs}
  - {url: 'https://ballerina.io/learn/call-java-code-from-ballerina/', kind: docs}
- id: class_mapping
  text: 'Recognise a generated binding class: a `distinct class` with the Java simple name, annotated `@java:Binding {''class: "java.util.ArrayDeque"}`, including `*java:JObject`, holding the Java object in `public handle jObj` and set up by `function init(handle obj)`'
  difficulty: [intermediate]
- id: constructors
  text: Create Java objects through the generated constructor functions outside the class, named `new<ClassName>` with a number per overload (e.g. `newArrayDeque1()`, `newArrayDeque2(int arg0)`)
  difficulty: [beginner, intermediate]
- id: methods
  text: Call Java instance methods as methods of the binding class (overloads get a numeric suffix) and static methods as module functions prefixed with the class name (e.g. `UUID_randomUUID()` for `UUID.randomUUID()`)
  difficulty: [beginner, intermediate]
- id: fields
  text: 'Read and write public Java fields through generated getters and setters: `get<FIELD>()` and `set<FIELD>(value)` methods for instance fields, and `<Class>_get<FIELD>()` and `<Class>_set<FIELD>(value)` functions for static fields (no setter for final fields)'
  difficulty: [intermediate]
- id: exception_errors
  text: Handle Java exceptions as the generated Ballerina error types of the same name (e.g. `read()` returns `int|IOException`), narrowing with a type test such as `if fileInputStream is javaio:FileNotFoundException`; an exception class generated explicitly as a binding class is named with a `J` prefix (e.g. `JFileNotFoundException`)
  difficulty: [intermediate]
- id: dependent_classes
  text: Know that Java classes used in the generated APIs get empty binding classes (only `jObj`, `init` and `toString`) that you fill in by running the tool again for them, that `java.lang.String` maps to `string`, and that generic methods return `java.lang.Object` bindings because generics are not supported
  difficulty: [intermediate, advanced]
- id: primitive_mapping
  text: 'Apply the Java-to-Ballerina type mapping in generated signatures: `boolean` to `boolean`, `byte` to `byte`, `int`/`short`/`char`/`long` to `int`, `float`/`double` to `float`, `String` to `string`, and other classes to binding classes'
  difficulty: [beginner, intermediate]
- id: optional_types
  text: Pass Java `null` through bindings by generating nilable parameter and return types with `--with-optional-types`, or only for parameters with `--with-optional-types-param` or only for returns with `--with-optional-types-return`
  difficulty: [intermediate]
- id: subtyping_and_cast
  text: Assign a binding of a Java subclass to its superclass binding (e.g. `InputStream inputStream = check newFileInputStream3("sample.txt");`), which works through type inclusion, and cast back down with `FileInputStream f = check java:cast(inputStream);`
  difficulty: [intermediate, advanced]
- id: inner_classes
  text: Generate bindings for inner classes with the `Outer$Inner` form, escaping the dollar sign in the shell (e.g. `bal bindgen java.lang.Character\$Subset`)
  difficulty: [intermediate]
- id: end_to_end_usage
  text: Use generated bindings in a program, e.g. `snakeyaml:Yaml yaml = snakeyaml:newYaml1();` and `javalang:Object mapObj = yaml.load(fileInputStream);`, then `bal build` and `bal run` the package
  difficulty: [intermediate]
  sources:
  - {url: 'https://ballerina.io/learn/call-java-code-from-ballerina/', kind: docs}
out_of_scope: ['Writing interop bindings by hand with `@java:Method` and friends (lib.jballerina.java)', Declaring platform dependencies in Ballerina.toml (tool.ballerina_toml)]
edges:
- {to: tool.bal, rel: requires}
- to: lib.jballerina.java
  rel: uses
  via: [class_mapping, dependent_classes, subtyping_and_cast]
- to: concept.external_functions
  rel: uses
  via: [class_mapping, methods]
- to: concept.classes
  rel: uses
  via: [class_mapping, dependent_classes]
- to: concept.type_ids_distinct
  rel: uses
  via: [class_mapping]
- to: concept.errors
  rel: uses
  via: [exception_errors]
- to: concept.type_cast_test
  rel: uses
  via: [exception_errors]
- to: concept.modules_imports
  rel: uses
  via: [output_layout, end_to_end_usage]
- to: tool.ballerina_toml
  rel: uses
  via: [maven_dependency]
notes: The docs table marks `--public` as 'Mandatory', but its description says it only applies when bindings go into a single directory, so it is treated as optional here. The docs say generated function names will improve in a future release.
