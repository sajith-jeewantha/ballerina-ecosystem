schema_version: "0.2"
id: topic.deployment
type: topic
title: Deployment
summary: "Deploying Ballerina applications to production as monolithic JAR or GraalVM native executables, as Docker, Kubernetes or OpenShift workloads generated by Code to Cloud, or as AWS Lambda and Azure Functions, with keystores, truststores and configuration supplied at runtime."
priority: important
status: draft
sources:
  - {url: "https://ballerina.io/learn/deployment-guidelines-overview/", kind: docs, note: "Deployment types and compatible Java versions"}
  - {url: "https://ballerina.io/learn/monolithic-deployment/", kind: docs, note: "Centralized and decentralized monolithic deployment"}
  - {url: "https://ballerina.io/learn/containerized-deployment/", kind: docs, note: "Docker, Kubernetes and OpenShift with Code to Cloud"}
  - {url: "https://ballerina.io/learn/serverless-deployment/", kind: docs, note: "AWS Lambda and Azure Functions"}
  - {url: "https://ballerina.io/learn/deploy-ballerina-on-kubernetes/", kind: docs}
  - {url: "https://ballerina.io/learn/keystore-truststore/", kind: docs, note: "Keystores and truststores"}
  - {url: "https://ballerina.io/learn/build-the-executable-locally/", kind: docs, note: "GraalVM native executable"}
must_cover:
  - id: jar_build
    text: "Build a deployable executable with `bal build`, which writes `target/bin/<package>.jar`, and pick the JRE that matches the Swan Lake update (Java 11 up to 2201.7.0, Java 17 for 2201.8.0 to 2201.10.0, Java 21 for 2201.11.0)"
    difficulty: [beginner]
    sources:
      - {url: "https://ballerina.io/learn/monolithic-deployment/", kind: docs}
      - {url: "https://ballerina.io/learn/deployment-guidelines-overview/", kind: docs}
  - id: graalvm_native
    text: "Compile an HTTP service to a native executable with `bal build --graalvm` after setting `GRAALVM_HOME` (e.g. GraalVM CE 21 for Update 11+), run `./target/bin/hello_world`, and verify dependencies flagged by the GraalVM compatibility warning with `bal test --graalvm`"
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/learn/build-the-executable-locally/", kind: docs}
  - id: graalvm_in_container
    text: "Build the native executable inside Docker with `bal build --graalvm --cloud=docker`, which generates a multi-stage Dockerfile (`native-image` on `ghcr.io/graalvm/native-image-community:21-ol9`, runtime on `gcr.io/distroless/base`), then `docker run -d -p 8080:8080 <image>`"
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/learn/build-the-executable-in-a-container/", kind: docs}
  - id: docker_image
    text: "Containerize a service with `cloud = \"docker\"` under `[build-options]` in `Ballerina.toml` (or `bal build --cloud=docker`) and a `Cloud.toml` with `[container.image]` `repository`, `name`, `tag` and `[settings] buildImage = true`, producing `target/docker/Dockerfile` and an image to `docker run`"
    difficulty: [beginner, intermediate]
    sources:
      - {url: "https://ballerina.io/learn/containerized-deployment/", kind: docs}
      - {url: "https://ballerina.io/learn/by-example/docker-hello-world/", kind: bbe}
  - id: kubernetes_deploy
    text: "Deploy a greeter service on Kubernetes: set `cloud = \"k8s\"`, give `[container.image]` in `Cloud.toml`, run `bal build` to generate `target/kubernetes/<package>` (Service, Deployment, HPA), `docker push` the image and `kubectl apply -f target/kubernetes/<package>`, exposing it with `kubectl expose deployment ... --type=NodePort` for testing"
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/learn/deploy-ballerina-on-kubernetes/", kind: docs}
      - {url: "https://ballerina.io/learn/by-example/kubernetes-hello-world/", kind: bbe}
  - id: k8s_resources_autoscaling
    text: "Size and scale the Kubernetes deployment in `Cloud.toml` with `[cloud.deployment]` `min_memory`, `max_memory`, `min_cpu`, `max_cpu` and `[cloud.deployment.autoscaling]` `min_replicas`, `max_replicas` and `cpu` (target CPU utilization)"
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/learn/containerized-deployment/", kind: docs}
  - id: k8s_probes
    text: "Add liveness and readiness probes by serving `service /probes on new http:Listener(9091)` with `resource function get healthz()` and `get readyz()` returning `true`, and pointing `[cloud.deployment.probes.liveness]` and `[cloud.deployment.probes.readiness]` (`port`, `path`) at them"
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/learn/containerized-deployment/", kind: docs}
  - id: k8s_config_map
    text: "Supply `configurable` values in Kubernetes by mounting `Config.toml` as a ConfigMap with `[[cloud.config.files]] file = \"./Config.toml\"`, which the generated Deployment exposes to the program through the `BAL_CONFIG_FILES` environment variable"
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/learn/containerized-deployment/", kind: docs}
  - id: openshift_deploy
    text: "Target OpenShift with `cloud = \"openshift\"` (or `bal build --cloud=openshift`), then apply the generated `target/openshift/<package>` YAML with `oc apply -f` and expose it with `oc expose deployment ... --type=NodePort`"
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/learn/containerized-deployment/", kind: docs}
  - id: kustomize_overlay
    text: "Customize the generated Kubernetes YAML without editing it by listing it under `resources` in a `kustomization.yaml` and adding `patchesStrategicMerge` patches such as a secret environment patch"
    difficulty: [advanced]
    sources:
      - {url: "https://ballerina.io/learn/containerized-deployment/", kind: docs}
  - id: k8s_ci_cd
    text: "Automate Kubernetes delivery in GitHub Actions with `ballerina-platform/ballerina-action@master` running `build --cloud=k8s`, `docker/login-action` and `docker push`, then `kubectl apply -f` on the generated artifacts using a kubeconfig from secrets"
    difficulty: [intermediate, advanced]
    sources:
      - {url: "https://ballerina.io/learn/containerized-deployment/", kind: docs}
  - id: aws_lambda_function
    text: "Deploy an S3-triggered function to AWS Lambda: annotate `public function s3Trigger(lambda:Context ctx, lambda:S3Event event) returns json` with `@lambda:Function`, build with `bal build --cloud=\"aws_lambda\"` (or `aws_lambda_image` for a container image), and create or update the function with the printed `aws lambda create-function`/`update-function-code` commands on the `provided.al2023` runtime"
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/learn/serverless-deployment/", kind: docs}
      - {url: "https://ballerina.io/learn/by-example/aws-lambda-s3-trigger/", kind: bbe}
  - id: aws_lambda_destinations
    text: "Route asynchronous Lambda results without code by setting `@lambda:Function {destinations: {onSuccess: \"arn:aws:sqs:...\", onFailure: \"arn:aws:sns:...\"}}`, and serve a function URL by declaring the event parameter as `lambda:FunctionURLRequest` and returning a `lambda:FunctionURLResponse` converted with `toJson()`"
    difficulty: [advanced]
    sources:
      - {url: "https://ballerina.io/learn/serverless-deployment/", kind: docs}
  - id: azure_functions_app
    text: "Deploy to Azure Functions: write `service / on new functions:HttpListener()` with a resource returning `[@functions:HttpOutput http:Created, @functions:QueueOutput {queueName: \"people\"} string]` or a `functions:TimerListener` service with `@functions:TimerTrigger {schedule: ...}`, build with `bal build --cloud=\"azure_functions\"` and publish with `func azure functionapp publish <app> --script-root target/azure_functions`"
    difficulty: [intermediate, advanced]
    sources:
      - {url: "https://ballerina.io/learn/serverless-deployment/", kind: docs}
      - {url: "https://ballerina.io/learn/by-example/azure-functions-http-trigger-with-queue/", kind: bbe}
      - {url: "https://ballerina.io/learn/by-example/azure-functions-timer-trigger/", kind: bbe}
  - id: azure_functions_native
    text: "Run Azure Functions as a native executable on a Linux function app, testing locally with `bal build --cloud=\"azure_functions_local\" --graalvm` and `func start --script-root target/azure_functions`, and building for the cloud with `bal build --cloud=\"azure_functions\" --graalvm`"
    difficulty: [advanced]
    sources:
      - {url: "https://ballerina.io/learn/serverless-deployment/", kind: docs}
  - id: centralized_monolith
    text: "Run a centralized monolithic deployment: build each component as a library package (`bal new --template lib`, `bal pack`, `bal push`), then in a deployment repository `bal tool pull consolidate-packages`, `bal consolidate-packages new --package-path <path> myorg/order,myorg/checkout` and `bal build` the consolidated project into one executable"
    difficulty: [advanced]
    sources:
      - {url: "https://ballerina.io/learn/monolithic-deployment/", kind: docs}
      - {url: "https://ballerina.io/learn/consolidate-packages-tool/", kind: docs}
  - id: default_listener
    text: "Share one port among many consolidated services by attaching them to `listener http:Listener httpListener = http:getDefaultListener();` and setting its port with `[ballerina.http] defaultListenerPort = 8080` in `Config.toml`"
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/learn/monolithic-deployment/", kind: docs}
      - {url: "https://github.com/ballerina-platform/module-ballerina-http/blob/master/docs/spec/spec.md", kind: github, note: "2.1.3 Default listener"}
  - id: keystore_mtls_listener
    text: "Create a PKCS12 keystore with `keytool -genkeypair -keyalg RSA -keysize 2048 -storetype PKCS12 -keystore keystore.p12`, build a truststore with `keytool -importcert`, and load them into an `http:Listener` with `secureSocket: {key: {path, password}, mutualSsl: {verifyClient: http:REQUIRE, cert: {path, password}}}` from `configurable` variables"
    difficulty: [intermediate, advanced]
    sources:
      - {url: "https://ballerina.io/learn/keystore-truststore/", kind: docs}
  - id: externalized_secrets
    text: "Keep keystore and truststore passwords out of code and disk by declaring them `configurable` and setting `BAL_CONFIG_VAR_keystorePassword` style environment variables at deploy time, with only the paths in `Config.toml`"
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/learn/keystore-truststore/", kind: docs}
out_of_scope:
  - "Full Cloud.toml property reference (tool.code_to_cloud)"
  - "GraalVM build options and compatibility metadata for library authors (tool.graalvm)"
  - "Load balancer configuration for hot deployment (NGINX, not Ballerina code)"
  - "Observability setup for deployed services (topic.observability)"
edges:
  - {to: tool.code_to_cloud, rel: uses, via: [graalvm_in_container, docker_image, kubernetes_deploy, k8s_resources_autoscaling, k8s_probes, k8s_config_map, openshift_deploy, kustomize_overlay, k8s_ci_cd, aws_lambda_function, azure_functions_app, azure_functions_native]}
  - {to: tool.graalvm, rel: uses, via: [graalvm_native, graalvm_in_container, azure_functions_native]}
  - {to: connector.aws, rel: uses, via: [aws_lambda_function, aws_lambda_destinations]}
  - {to: connector.azure, rel: uses, via: [azure_functions_app, azure_functions_native]}
  - {to: lib.http, rel: uses, via: [k8s_probes, azure_functions_app, default_listener, keystore_mtls_listener]}
  - {to: tool.bal, rel: uses, via: [jar_build, centralized_monolith]}
  - {to: tool.bal_test, rel: uses, via: [graalvm_native]}
  - {to: tool.ballerina_toml, rel: uses, via: [docker_image, kubernetes_deploy, openshift_deploy]}
  - {to: tool.config_toml, rel: uses, via: [k8s_config_map, default_listener, externalized_secrets]}
  - {to: tool.ci_cd, rel: uses, via: [k8s_ci_cd]}
  - {to: tool.central, rel: uses, via: [centralized_monolith]}
  - {to: tool.bal_tool, rel: uses, via: [centralized_monolith]}
  - {to: platform.runtime, rel: uses, via: [jar_build]}
  - {to: concept.services_listeners, rel: uses, via: [k8s_probes, azure_functions_app, default_listener]}
  - {to: concept.annotations, rel: uses, via: [aws_lambda_function, aws_lambda_destinations, azure_functions_app]}
  - {to: concept.variables, rel: uses, via: [externalized_secrets]}
  - {to: topic.observability, rel: related}
  - {to: topic.security, rel: related}
notes: "The decentralized CI/CD flow and hot deployment with NGINX (active-active, active-passive) on the monolithic page are process guidance without Ballerina code and are not items. AWS Lambda details (function URLs, destinations, `aws_lambda_image`, `provided.al2023`) come from the current serverless-deployment page."
