schema_version: "0.1"
id: concept.langlib_xml
type: concept
title: lang.xml
summary: The `lang.xml` module's constants, built-in subtypes and functions for accessing, constructing, selecting, transforming and parsing xml values.
priority: important
status: draft
sources:
  - {url: "https://ballerina.io/spec/lang/2024R1/#lang.xml", kind: spec, note: "11.3.16 lang.xml module"}
must_cover:
  - id: namespace_constants
    text: "Use the constants `xml:XML_NAMESPACE_URI`, `xml:XMLNS_NAMESPACE_URI` and the expanded attribute names `xml:space`, `xml:lang` and `xml:base` (e.g. `\"{http://www.w3.org/XML/1998/namespace}lang\"`)"
    difficulty: [intermediate]
  - id: length_iteration
    text: "Use `x.length()` for the number of items in an xml sequence and iterate with `foreach` or `x.iterator()`, where each item is an xml singleton"
    difficulty: [beginner]
  - id: get_vs_index
    text: "Use `x.get(i)` to get the item at index `i`, and distinguish it from `x[i]`: `get` panics when there is no item with that index, whereas `x[i]` returns empty xml for an index >= the length (and panics only for a negative index)"
    difficulty: [intermediate]
  - id: concat
    text: "Build sequences with `xml:concat(...xs)`, which concatenates xml and string values (strings become text) and returns an empty xml sequence when given no arguments"
    difficulty: [beginner]
  - id: element_name
    text: "Read and change an element's expanded name with `getName()` and `setName(xName)`"
    difficulty: [intermediate]
  - id: attributes
    text: "Use `getAttributes()` to get an element's attributes as `map<string>` keyed by expanded attribute names, including namespace attributes"
    difficulty: [intermediate]
  - id: children
    text: "Read and replace an element's children with `getChildren()` and `setChildren(xml|string)`, knowing that `setChildren` panics if it would make the element structure cyclic"
    difficulty: [intermediate]
  - id: descendants
    text: "Use `getDescendants()` to get the children together with, recursively, the descendants of each child element, in document order (each element immediately precedes its descendants)"
    difficulty: [intermediate, advanced]
  - id: character_data
    text: "Use `xml:data(x)` to get the character data of an xml value: text characters and, recursively, element content, with comments, processing instructions and empty sequences contributing the empty string"
    difficulty: [intermediate]
  - id: pi_comment_access
    text: "Use `getTarget()` on a processing instruction and `getContent()` on a processing instruction or comment"
    difficulty: [intermediate]
  - id: create_items
    text: "Construct items with `xml:createElement(name, attributes = {}, children = xml``)` (copies the attributes into a new map), `xml:createProcessingInstruction(target, content)`, `xml:createComment(content)` and `xml:createText(data)`, which returns empty xml for an empty string"
    difficulty: [intermediate]
  - id: slice
    text: "Use `slice(startIndex, endIndex = x.length())` to get the subsequence of items with index >= startIndex and < endIndex"
    difficulty: [beginner, intermediate]
  - id: strip
    text: "Use `strip()` to remove comments, processing instructions and text items consisting entirely of XML white space (the S production of XML 1.0) from an xml sequence"
    difficulty: [intermediate]
  - id: selection
    text: "Select items with `elements(nm = ())` (element items, optionally only those with expanded name `nm`), `children()` (equivalent to `elements(x).map(getChildren)`), `elementChildren(nm = ())` (equivalent to `children(x).elements(nm)`) and `text()` (the concatenated text items)"
    difficulty: [intermediate]
  - id: higher_order
    text: "Transform xml sequences item by item with `map` (returns `xml<XmlType>`), `forEach` and `filter`, where each item is passed as a singleton"
    difficulty: [intermediate]
  - id: from_string
    text: "Parse XML text with `xml:fromString(s)`, which parses using the XML 1.0 `content` production and returns `xml|error`"
    difficulty: [beginner, intermediate]
out_of_scope:
  - "xml types, the xml template and xml concatenation with + (concept.xml)"
  - "Namespace processing and xmlns declarations (concept.xml_namespaces)"
  - "Navigation syntax `x/*`, `x/<a>`, `x.<a>` and attribute access (concept.xml_navigation)"
edges:
  - {to: concept.xml, rel: requires}
  - {to: concept.langlib, rel: part_of}
  - {to: concept.xml_namespaces, rel: uses, via: [namespace_constants, element_name, attributes]}
  - {to: concept.xml_navigation, rel: related, note: "XML step expressions are defined in terms of xml:map, xml:elements, xml:getChildren and xml:getDescendants"}
  - {to: concept.langlib_conventions, rel: uses, via: [higher_order, selection], target_items: [builtin_subtypes, type_params]}
notes: "The empty-xml result of `x[i]` comes from 6.14 (member access); the `get` doc comment only says that `get` panics where `x[i]` does not. The `xml:Text` doc comment says 'singleton test sequence' (a typo for text)."
