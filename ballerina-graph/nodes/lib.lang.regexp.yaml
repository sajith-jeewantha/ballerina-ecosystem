schema_version: "0.1"
id: lib.lang.regexp
type: library
title: ballerina/lang.regexp
summary: The preview `lang.regexp` module provides the `RegExp`, `Span` and `Groups` types and functions for finding, matching, replacing and splitting with `re` regular expressions.
priority: important
status: draft
modules: [ballerina/lang.regexp]
sources:
  - {url: "https://ballerina.io/spec/lang/2024R1/#lang.regexp", kind: spec, note: "11.3.11 lang.regexp module (preview)"}
must_cover:
  - id: regexp_type
    text: "Use `regexp:RegExp`, the built-in subtype naming the tagged data basic type for tag `re`, as the type of `re`...`` values and of function parameters that take regular expressions, importing `ballerina/lang.regexp` to refer to it"
    difficulty: [beginner, intermediate]
  - id: span_type
    text: "Use a `regexp:Span`, a readonly object with `startIndex`, `endIndex` (the index after the end, so the length is `endIndex - startIndex`) and a `substring()` method that returns the matched text"
    difficulty: [intermediate]
  - id: groups_type
    text: "Use `regexp:Groups` (`readonly & [Span, Span?...]`), where member 0 is the match of the whole regular expression and member i is the i-th capturing group (groups ordered by the position of their opening parenthesis), which is nil if the match did not use that group"
    difficulty: [intermediate, advanced]
  - id: find_first
    text: "Find the first match at or after `startIndex` (default 0) with `re.find(str, startIndex)` returning `Span?`, or with `findGroups` returning `Groups?`"
    difficulty: [intermediate]
  - id: find_all
    text: "Find all matches with `findAll` (returns `Span[]`) and `findAllGroups` (returns `Groups[]`), knowing that each search continues where the previous match ended, so matches never overlap"
    difficulty: [intermediate]
  - id: match_at
    text: "Test for a match that starts exactly at an index with `matchAt(str, startIndex = 0)` (returns `Span?` whose `startIndex` equals the given index) or `matchGroupsAt` (returns `Groups?`)"
    difficulty: [intermediate, advanced]
  - id: full_match
    text: "Test whether a regular expression matches the whole string (from index 0 to its length) with `isFullMatch(str)`, or get the groups of such a match with `fullMatchGroups(str)`, which returns nil if there is no full match"
    difficulty: [beginner, intermediate]
  - id: replace
    text: "Replace the first match with `replace(str, replacement, startIndex = 0)` and every non-overlapping match with `replaceAll(str, replacement, startIndex = 0)`, where `replacement` is a `Replacement` (a fixed string or a `ReplacerFunction`)"
    difficulty: [intermediate]
  - id: replacer_function
    text: "Write a `ReplacerFunction` (`isolated function(Groups groups) returns string`) that builds each replacement from the match's groups, e.g. to reformat captured dates"
    difficulty: [advanced]
  - id: split
    text: "Split a string with `re.split(str)`, which returns the substrings before the first match, between matches and after the last match of the separator pattern, or `[str]` if nothing matches"
    difficulty: [beginner, intermediate]
  - id: from_string
    text: "Build a regular expression at runtime with `regexp:fromString(str)`, which accepts the same syntax as the `re` template and returns an error if `str` is not a valid regular expression"
    difficulty: [intermediate]
  - id: abstract_matcher
    text: "Explain that `matchGroupsAt` corresponds to the ECMAScript abstract matching function and that `matchAt`, `find`, `findGroups`, `findAll`, `findAllGroups`, the full-match functions and `isFullMatch` can be defined in terms of it"
    difficulty: [advanced]
    sources:
      - {url: "https://ballerina.io/spec/lang/2024R1/#section_10.1", kind: spec, note: "10.1 Regular expressions (preview)"}
out_of_scope:
  - "Regular expression syntax, flags, the `re` template and interpolation (concept.regexp)"
  - "string:matches and string:includesMatch (lib.lang.string)"
edges:
  - {to: lib.langlib, rel: part_of}
  - {to: lib.langlib, rel: uses, via: [regexp_type], target_items: [override_predeclared, builtin_subtype_annotation]}
  - {to: concept.regexp, rel: uses, via: [regexp_type, span_type, groups_type, find_first, find_all, match_at, full_match, replace, split, from_string, abstract_matcher]}
  - {to: concept.function_values, rel: uses, via: [replacer_function]}
notes: "Content moved from the removed concept.langlib_regexp node. lang.regexp is preview in 2024R1. Spec typos: the `Groups` doc comment says 'The group with index i, where i > 1, is the i-th capturing group' (should read i >= 1); section 10.1 refers to a `fullMatchGroup` function while the module defines `fullMatchGroups`; the `findAllGroups` return doc says 'a `Group`' for each match. The spec does not say what happens for an out-of-range `startIndex`. That `regexp` needs an import is derived from the 8.1 predeclared-prefix list, which omits it."
