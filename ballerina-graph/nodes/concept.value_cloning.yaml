schema_version: "0.1"
id: concept.value_cloning
type: concept
title: Value conversion
summary: The Cloneable type, deep copying with `clone` and `cloneReadOnly` (Clone and ImmutableClone) and constructing a value of a specified type with `cloneWithType`, plus the ToString operation in its expression, informal and direct styles, the `toString`, `toBalString` and `fromBalString` functions, and numeric and boolean parsing and formatting functions.
priority: important
status: draft
sources:
  - {url: "https://ballerina.io/spec/lang/2024R1/#Cloning", kind: spec, note: "5.8.2 Cloning"}
  - {url: "https://ballerina.io/spec/lang/2024R1/#Clone", kind: spec, note: "5.8.2.1 Clone"}
  - {url: "https://ballerina.io/spec/lang/2024R1/#ImmutableClone", kind: spec, note: "5.8.2.2 ImmutableClone"}
  - {url: "https://ballerina.io/spec/lang/2024R1/#lang.value", kind: spec, note: "11.3.19 lang.value"}
  - {url: "https://ballerina.io/spec/lang/2024R1/#ToString", kind: spec, note: "5.8.5 ToString"}
must_cover:
  - id: cloneable_type
    text: Use the `value:Cloneable` type, defined as `readonly|xml|Cloneable[]|map<Cloneable>|table<map<Cloneable>>`, as the domain of the cloning operations
    difficulty: [intermediate]
  - id: clone_fn
    text: Use `v.clone()` to make a deep copy of structured and sequence values that keeps the same inherent types and returns immutable values (and immutable subtrees) without copying them
    difficulty: [beginner, intermediate]
  - id: clone_graph_structure
    text: Explain that Clone preserves the graph of references, so shared members stay shared, cycles are reproduced and cloning a cyclic value terminates
    difficulty: [advanced]
  - id: clone_readonly_fn
    text: Use `v.cloneReadOnly()` to get a deep immutable copy of type `T & readonly`, where every newly constructed value has its read-only bit on and already-immutable values are not copied
    difficulty: [intermediate]
  - id: immutable_clone
    text: Explain the ImmutableClone operation, which preserves graph structure including cycles by building the whole graph before making it immutable, and is used implicitly for error detail fields and annotation values
    difficulty: [advanced]
    sources:
      - {url: "https://ballerina.io/spec/lang/2024R1/#section_6.17", kind: spec, note: "6.17 Error constructor (detail ImmutableClone)"}
      - {url: "https://ballerina.io/spec/lang/2024R1/#section_9.1", kind: spec, note: "9.1 Annotations (ImmutableClone of values)"}
  - id: clone_equality
    text: Rely on `x.clone() == x` being true for every anydata value x
    difficulty: [beginner, intermediate]
    sources:
      - {url: "https://ballerina.io/spec/lang/2024R1/#DeepEquals", kind: spec, note: "5.8.3 DeepEquals"}
  - id: clone_isolated
    text: Know that calls to `clone` and `cloneReadOnly` are always isolated expressions, so they can be used to safely transfer values into or out of `lock` statements
    difficulty: [advanced]
    sources:
      - {url: "https://ballerina.io/spec/lang/2024R1/#function_call", kind: spec, note: "6.15 Function call expression"}
  - id: clone_with_type
    text: Use `v.cloneWithType(T)` or `T x = check v.cloneWithType();` to construct a value of a specified anydata type by deep copy, where inherent types and read-only bits come from T, for a union the leftmost workable member is used, and missing record fields are filled from defaults
    difficulty: [intermediate]
  - id: clone_with_type_differences
    text: 'Explain how cloneWithType differs from clone: the result is always a tree, so it returns an error on cyclic input, immutable structural values are copied, and numeric values are converted with NumericConvert'
    difficulty: [advanced]
  - id: clone_on_send
    text: Explain that a worker send applies Clone to the message value, so the receiver gets a copy rather than a shared reference
    difficulty: [advanced]
    sources:
      - {url: "https://ballerina.io/spec/lang/2024R1/#section_7.8.1.1", kind: spec, note: "7.8.1.1 Async send action"}
  - id: tostring_styles
    text: 'Distinguish the three ToString styles: expression style (looks like a Ballerina expression), informal style (similar but avoids Ballerina-specific syntax) and direct style (converts the value itself, e.g. a string stays unchanged and xml becomes XML text)'
    difficulty: [intermediate]
  - id: value_to_string
    text: Use `v.toString()` (`value:toString`) for a direct-style conversion of any non-error value, e.g. `"xyz".toString()` is `xyz`, `1.20d.toString()` is `1.20`, and nested members of lists and maps use informal style such as `[1,"a"]`
    difficulty: [beginner]
  - id: to_bal_string
    text: Use `v.toBalString()` for expression style, which for acyclic anydata produces valid Ballerina source that evaluates to a value `==` to v (e.g. `"xyz"` with quotes, `1.20d`, `float:NaN`, `()`)
    difficulty: [intermediate]
  - id: from_bal_string
    text: Use `value:fromBalString(s)` to parse the subset of expression syntax produced by `toBalString` back into an anydata value, returning an error if it cannot be parsed
    difficulty: [intermediate]
  - id: special_values_formatting
    text: Know how special values are rendered, namely nil as `()` in expression style and `null` in informal style, float NaN and infinity as `float:NaN`/`float:Infinity` in expression style and `NaN`/`Infinity` otherwise, and decimals with a `d` suffix only in expression style
    difficulty: [intermediate, advanced]
  - id: structured_formatting
    text: Know the rendering of structured values, namely arrays as `[X,Y]`, maps as `{"x":X,"y":Y}` and tables as `table key(k) [R1,R2]` in expression style or `[R1,R2]` otherwise
    difficulty: [intermediate]
  - id: error_formatting
    text: Convert errors with `e.toString()` and `e.toBalString()`, which render `error D1&D2 (M,C,F1=V1,...)` with type-ids, message, cause and detail fields
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/spec/lang/2024R1/#lang.error", kind: spec, note: "11.3.4 lang.error toString/toBalString"}
  - id: object_cycle_formatting
    text: Explain that an object with a `toString` method is converted using that method's result, while an object without one is rendered as `object` with its type-ids and a unique identifier, and that ToString detects cycles and renders them as `...[N]` in expression style (N the 0-based depth index) and `...` otherwise
    difficulty: [advanced]
  - id: parse_numbers
    text: Parse strings with `int:fromString`, `int:fromHexString`, `float:fromString` (accepting `NaN` and `Infinity`), `float:fromHexString`, `decimal:fromString` and `boolean:fromString`, each returning an error on invalid input
    difficulty: [beginner, intermediate]
    sources:
      - {url: "https://ballerina.io/spec/lang/2024R1/#lang.int", kind: spec, note: "11.3.8 lang.int"}
      - {url: "https://ballerina.io/spec/lang/2024R1/#lang.float", kind: spec, note: "11.3.5 lang.float"}
      - {url: "https://ballerina.io/spec/lang/2024R1/#lang.decimal", kind: spec, note: "11.3.3 lang.decimal"}
      - {url: "https://ballerina.io/spec/lang/2024R1/#lang.boolean", kind: spec, note: "11.3.2 lang.boolean"}
  - id: format_numbers
    text: Format numbers with `int:toHexString`, `float:toHexString`, `float:toFixedString(x, digits)` and `float:toExpString(x, digits)`, knowing the last two panic for negative fractionDigits and round ties to even
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/spec/lang/2024R1/#lang.float", kind: spec, note: "11.3.5 lang.float"}
      - {url: "https://ballerina.io/spec/lang/2024R1/#lang.int", kind: spec, note: "11.3.8 lang.int"}
out_of_scope:
  - "JSON-specific conversions toJson / fromJsonWithType (concept.json_anydata)"
  - "Safe casting with ensureType (concept.type_cast_test)"
  - "JSON text conversion toJsonString / fromJsonString (concept.json_anydata)"
  - "String templates (concept.strings)"
edges:
  - {to: concept.mutability_readonly, rel: requires}
  - {to: lib.lang.value, rel: uses, via: [clone_fn, clone_readonly_fn, clone_with_type, value_to_string, to_bal_string, from_bal_string, parse_numbers, format_numbers]}
  - {to: lib.lang.int, rel: uses, via: [clone_fn, clone_readonly_fn, clone_with_type, value_to_string, to_bal_string, from_bal_string, parse_numbers, format_numbers]}
  - {to: lib.lang.float, rel: uses, via: [clone_fn, clone_readonly_fn, clone_with_type, value_to_string, to_bal_string, from_bal_string, parse_numbers, format_numbers]}
  - {to: lib.lang.decimal, rel: uses, via: [clone_fn, clone_readonly_fn, clone_with_type, value_to_string, to_bal_string, from_bal_string, parse_numbers, format_numbers]}
  - {to: lib.langlib, rel: uses, via: [clone_fn, clone_readonly_fn, clone_with_type, value_to_string, to_bal_string, from_bal_string, parse_numbers, format_numbers]}
  - {to: lib.lang.error, rel: uses, via: [clone_fn, clone_readonly_fn, clone_with_type, value_to_string, to_bal_string, from_bal_string, parse_numbers, format_numbers]}
  - {to: concept.comparison_equality, rel: uses, via: [clone_equality], target_items: [deep_equals_semantics]}
  - {to: concept.numeric_types, rel: uses, via: [clone_with_type_differences], target_items: [numeric_convert]}
  - {to: concept.strings, rel: requires}
notes: "In the ToString table the direct-style cell for nil is empty in the HTML; it is unclear whether direct style renders nil as an empty string or falls back to informal `null`. Left out of items."
