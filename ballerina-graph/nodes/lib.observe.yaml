schema_version: "0.1"
id: lib.observe
type: library
title: ballerina/observe
summary: "The `observe` module exposes Ballerina's built-in observability: custom tracing spans and tags, custom counter and gauge metrics, and the runtime switches, while extension modules (OpenTelemetry, Prometheus, Jaeger, Zipkin, New Relic, Moesif) report the collected metrics and traces once observability is included at build time and enabled in Config.toml."
priority: important
status: draft
modules: [ballerina/observe, ballerina/otel, ballerinax/prometheus, ballerinax/jaeger, ballerinax/zipkin, ballerinax/newrelic, ballerinax/moesif]
sources:
  - {url: "https://central.ballerina.io/ballerina/observe/latest", kind: central, note: "ballerina/observe 1.8.0 package docs"}
  - {url: "https://github.com/ballerina-platform/module-ballerina-observe/blob/master/ballerina/README.md", kind: github, note: "Module README (tracing and metrics API)"}
  - {url: "https://ballerina.io/learn/overview-of-ballerina-observability/", kind: docs}
  - {url: "https://ballerina.io/learn/by-example/tracing/", kind: bbe}
  - {url: "https://ballerina.io/learn/by-example/counter-metrics/", kind: bbe}
  - {url: "https://ballerina.io/learn/by-example/gauge-metrics/", kind: bbe}
must_cover:
  - id: include_observability
    text: "Include observability in the build by setting `observabilityIncluded = true` under `[build-options]` in Ballerina.toml (generated by default by `bal new`) or by running with the `--observability-included` flag"
    difficulty: [beginner]
    sources:
      - {url: "https://ballerina.io/learn/overview-of-ballerina-observability/", kind: docs}
  - id: runtime_config
    text: "Enable metrics and tracing at runtime in Config.toml with `[ballerina.observe]` `enabled = true` and a `provider`, or separately with `metricsEnabled`/`metricsReporter` and `tracingEnabled`/`tracingProvider` (e.g. `otel`, `prometheus`, `jaeger`, `zipkin`, `newrelic`)"
    difficulty: [beginner, intermediate]
    sources:
      - {url: "https://ballerina.io/learn/overview-of-ballerina-observability/", kind: docs}
  - id: prometheus_metrics
    text: "Expose metrics for Prometheus by adding `import ballerinax/prometheus as _;`, setting `metricsReporter = \"prometheus\"`, and configuring the `/metrics` endpoint with `[ballerinax.prometheus]` `host` and `port` (default 9797)"
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/learn/supported-observability-tools-and-platforms/prometheus/", kind: docs}
  - id: jaeger_zipkin_tracing
    text: "Publish traces to Jaeger or Zipkin by adding `import ballerinax/jaeger as _;` (or `ballerinax/zipkin`), setting `tracingProvider = \"jaeger\"` (or `\"zipkin\"`), and configuring `[ballerinax.jaeger]` `agentHostname`, `agentPort`, `samplerType`, `samplerParam`, `reporterFlushInterval` and `reporterBufferSize`"
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/learn/supported-observability-tools-and-platforms/jaeger/", kind: docs}
      - {url: "https://ballerina.io/learn/supported-observability-tools-and-platforms/zipkin/", kind: docs}
  - id: opentelemetry
    text: "Export traces and metrics over OTLP with the bundled `ballerina/otel` extension (Swan Lake Update 14+, no import needed) by setting `tracingProvider = \"otel\"` and `metricsReporter = \"otel\"` and configuring `[ballerina.otel]` `tracesEndpoint`, `metricsEndpoint`, `metricsServiceName` and optional protocol, sampler and resource-attribute settings"
    difficulty: [intermediate, advanced]
    sources:
      - {url: "https://ballerina.io/learn/supported-observability-tools-and-platforms/opentelemetry/", kind: docs}
  - id: saas_providers
    text: "Report to hosted platforms by importing `ballerinax/newrelic as _` (configured with `[ballerinax.newrelic]` `apiKey`) or `ballerinax/moesif as _` (`[ballerinax.moesif]` `applicationId`) and setting them as the tracing provider and metrics reporter"
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/learn/supported-observability-tools-and-platforms/new-relic/", kind: docs}
      - {url: "https://ballerina.io/learn/supported-observability-tools-and-platforms/moesif/", kind: docs}
  - id: default_observation
    text: "Explain that services, resource and remote functions, client calls, workers and `main` are observed automatically with common tags such as `src.module`, `src.resource.path`, `src.resource.accessor`, `entrypoint.function.name` and `error`, and use `@observe:Observable` to make another function observable"
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/learn/overview-of-ballerina-observability/", kind: docs}
      - {url: "https://github.com/ballerina-platform/module-ballerina-observe/blob/master/ballerina/annotations.bal", kind: github}
  - id: child_span
    text: "Measure a block of code as a span inside the current system trace with `int spanId = check observe:startSpan(\"MyLogicSpan\")` and close it with `observe:finishSpan(spanId)`"
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/learn/by-example/tracing/", kind: bbe}
  - id: root_span
    text: "Start an independent trace with `observe:startRootSpan(\"Parent\")` and attach children with `observe:startSpan(\"Child\", (), parentSpanId)`, finishing every span (or `observe:finishSpanWithError(spanId, err)` to record a failure)"
    difficulty: [intermediate, advanced]
    sources:
      - {url: "https://ballerina.io/learn/by-example/tracing/", kind: bbe}
      - {url: "https://github.com/ballerina-platform/module-ballerina-observe/blob/master/ballerina/natives.bal", kind: github}
  - id: span_tags
    text: "Add tags to spans with `observe:addTagToSpan(\"key\", \"value\")` (current span) or `observe:addTagToSpan(\"key\", \"value\", spanId)`, add tags to system metrics with `observe:addTagToMetrics`, and read the trace and span IDs with `observe:getSpanContext()`"
    difficulty: [intermediate]
    sources:
      - {url: "https://github.com/ballerina-platform/module-ballerina-observe/blob/master/ballerina/README.md", kind: github}
      - {url: "https://github.com/ballerina-platform/module-ballerina-observe/blob/master/ballerina/natives.bal", kind: github}
  - id: counter
    text: "Count events with `observe:Counter c = new (\"total_orders\", desc = \"...\", tags = {...});`, using `increment()` or `increment(amount)`, `reset()` and `getValue()`"
    difficulty: [beginner, intermediate]
    sources:
      - {url: "https://ballerina.io/learn/by-example/counter-metrics/", kind: bbe}
  - id: gauge
    text: "Track values that go up and down with `observe:Gauge` using `increment`, `decrement`, `setValue` and `getValue`, and get statistics from `getSnapshot()` configured by `observe:StatisticConfig` (`timeWindow`, `buckets`, `percentiles`), or disable them with an empty config array"
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/learn/by-example/gauge-metrics/", kind: bbe}
  - id: register_metrics
    text: "Register a counter or gauge in the global registry with `register()` (returns `error?`) so it is reported to the metrics backend, remove it with `unregister()`, and look metrics up with `observe:lookupMetric(name, tags)` or `observe:getAllMetrics()`"
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/learn/by-example/counter-metrics/", kind: bbe}
      - {url: "https://github.com/ballerina-platform/module-ballerina-observe/blob/master/ballerina/README.md", kind: github}
  - id: runtime_checks
    text: "Check the observability state at runtime with `observe:isObservabilityEnabled()`, `isMetricsEnabled()`, `isTracingEnabled()`, `getMetricsReporter()` and `getTracingProvider()`"
    difficulty: [advanced]
    sources:
      - {url: "https://github.com/ballerina-platform/module-ballerina-observe/blob/master/ballerina/commons.bal", kind: github}
out_of_scope:
  - "Logging, log formats and log destinations (lib.log)"
  - "Setting up dashboards, collectors and platforms such as Grafana, Datadog or Elastic Stack (topic.observability)"
  - "Ballerina.toml build options in general (tool.ballerina_toml)"
edges:
  - {to: concept.classes, rel: uses, via: [counter, gauge]}
  - {to: concept.records, rel: uses, via: [gauge]}
  - {to: concept.maps, rel: uses, via: [counter, span_tags]}
  - {to: concept.errors, rel: uses, via: [child_span, register_metrics]}
  - {to: concept.annotations, rel: uses, via: [default_observation]}
  - {to: concept.modules_imports, rel: uses, via: [prometheus_metrics, jaeger_zipkin_tracing, saas_providers]}
  - {to: tool.config_toml, rel: uses, via: [runtime_config, prometheus_metrics, jaeger_zipkin_tracing, opentelemetry, saas_providers]}
  - {to: tool.ballerina_toml, rel: uses, via: [include_observability]}
notes: "Datadog and Elastic Stack guides reuse the Prometheus/Jaeger extensions and log shipping; OpenSearch is also listed in the docs but not reviewed. `ballerina/otel` is bundled from Swan Lake Update 14 per the OpenTelemetry guide."
