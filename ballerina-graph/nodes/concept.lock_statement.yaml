schema_version: "0.1"
id: concept.lock_statement
type: concept
title: Lock
summary: The lock statement, which runs a block as if not interleaved with other locks, and the restrictions that apply when it guards isolated variables or isolated object state.
priority: important
status: draft
sources:
  - {url: "https://ballerina.io/spec/lang/2024R1/#lock_statement", kind: spec, note: "7.22 Lock statement"}
must_cover:
  - id: lock_basic
    text: "Use `lock { ... }` so that the block's effect on program state is as if it were not interleaved with any lock statement executing on another strand"
    difficulty: [beginner, intermediate]
  - id: lock_implementation
    text: "Explain that a lock behaves like acquiring one program-wide recursive mutex around the block, while implementations may infer finer-grained locking with the same effect"
    difficulty: [intermediate]
  - id: no_new_strands
    text: "Know that `start` and named worker declarations are compile-time errors lexically inside a lock, and that starting a strand while a lock is held panics"
    difficulty: [intermediate]
  - id: no_send_receive
    text: "Know that a lock statement may not contain a sync send action (`->>`) or a receive action (`<-`), a restriction added in 2024R1"
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/spec/lang/2024R1/#section_B.1", kind: spec, note: "B.1 Changes 2023R1 to 2024R1"}
  - id: isolated_var_access
    text: "Access an `isolated` module-level variable only inside a lock statement"
    difficulty: [intermediate]
  - id: self_in_isolated_object
    text: "In the methods of an isolated object, access `self.x` inside a lock unless field `x` is isolated (final with a readonly or isolated-object type)"
    difficulty: [intermediate, advanced]
  - id: one_restricted_variable
    text: "Know that a lock statement may use at most one restricted variable (an isolated module variable or `self` of an isolated object)"
    difficulty: [advanced]
  - id: isolated_calls_only
    text: "Know that inside a lock using a restricted variable only functions and methods with isolated types may be called"
    difficulty: [advanced]
  - id: transfer_out
    text: "Apply the transfer-out rules: a `return` inside the lock must return an isolated expression, and an assignment to a variable defined outside must have a plain variable name on the left and an isolated expression on the right (assigning the restricted variable itself is exempt)"
    difficulty: [advanced]
  - id: transfer_in
    text: "Apply the transfer-in rule: a reference to a variable or parameter defined outside the lock must occur within an isolated expression (for example `x.clone()` or a readonly value), and in a non-isolated object `self` is treated like a parameter"
    difficulty: [advanced]
out_of_scope:
  - "Isolated functions, objects and variables in general (concept.isolation)"
  - "on fail on lock statements (concept.error_handling)"
edges:
  - {to: concept.isolation, rel: requires}
  - {to: concept.strands_workers, rel: requires}
  - {to: concept.worker_messages, rel: uses, via: [no_send_receive]}
