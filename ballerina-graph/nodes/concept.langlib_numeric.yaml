schema_version: "0.1"
id: concept.langlib_numeric
type: concept
title: lang.int, lang.float and lang.decimal functions
summary: Constants and functions of the numeric lang library modules for aggregation, rounding, maths, parsing, formatting and bit-level conversion of int, float and decimal values.
priority: important
status: draft
sources:
  - {url: "https://ballerina.io/spec/lang/2024R1/#lang.int", kind: spec, note: "11.3.8 lang.int module"}
  - {url: "https://ballerina.io/spec/lang/2024R1/#lang.float", kind: spec, note: "11.3.5 lang.float module"}
  - {url: "https://ballerina.io/spec/lang/2024R1/#lang.decimal", kind: spec, note: "11.3.3 lang.decimal module"}
must_cover:
  - id: int_constants
    text: "Use the `lang.int` constants `int:MAX_VALUE` (9223372036854775807), `int:MIN_VALUE` (defined as `-9223372036854775807 - 1` because the literal 9223372036854775808 would overflow) and the subtype bounds `SIGNED32_MAX_VALUE`, `SIGNED32_MIN_VALUE`, `SIGNED16_*`, `SIGNED8_*` and `UNSIGNED32/16/8_MAX_VALUE`"
    difficulty: [beginner, intermediate]
  - id: int_aggregates
    text: "Use `int:abs`, `int:sum(...ns)` (0 for no arguments), `int:max(n, ...ns)` and `int:min(n, ...ns)`, which need at least one argument"
    difficulty: [beginner]
  - id: int_avg
    text: "Use `int:avg(n, ...ns)`, which computes the average with the decimal type, returns `decimal` (not int) and panics if the sum overflows decimal"
    difficulty: [intermediate]
  - id: int_parse_format
    text: "Parse and format ints with `int:fromString(s)` (decimal digits with an optional leading `+` or `-`; returns an error otherwise), `toHexString()` (lower-case, no `0x` prefix, `-` prefix for negatives) and `int:fromHexString(s)` (upper- or lower-case digits, optional sign, no `0x`/`0X` prefix allowed)"
    difficulty: [beginner, intermediate]
  - id: int_range
    text: "Use `int:range(start, end, step)` to get an `object:Iterable` over `start + step*i` that is increasing and < end when step > 0, decreasing and > end when step < 0, and panics when step is 0"
    difficulty: [intermediate]
  - id: float_constants
    text: "Use the `lang.float` constants `float:PI`, `float:E`, `float:NaN` (`0.0/0.0`) and `float:Infinity` (`1.0/0.0`)"
    difficulty: [beginner]
  - id: float_classify
    text: "Classify floats with `isNaN`, `isFinite` and `isInfinite`, exactly one of which is true for any float value"
    difficulty: [beginner, intermediate]
  - id: float_aggregates
    text: "Use `float:sum`, `float:max`, `float:min` and `float:avg`, which take zero or more arguments: `sum` of no arguments is +0.0, `max` is -∞, `min` is +∞ and `avg` is NaN, and `sum`, `max` and `min` return NaN if any argument is NaN"
    difficulty: [intermediate]
  - id: decimal_aggregates
    text: "Use `decimal:sum(...xs)` (0 for no arguments) and `decimal:max`, `decimal:min` and `decimal:avg`, which require at least one argument"
    difficulty: [beginner, intermediate]
  - id: rounding
    text: "Round with `round(fractionDigits = 0)` on float and decimal values, which rounds to the nearest multiple of 10^-fractionDigits with ties to even (e.g. `2.5.round()` is 2.0), and use `floor`, `ceiling` and `abs`; float `round` returns NaN, ±0 and ±∞ unchanged"
    difficulty: [beginner, intermediate]
  - id: round_vs_cast
    text: "Explain that converting with `<int>x` is the same as `<int>x.round(0)` for both float and decimal, so the conversion rounds half to even rather than truncating"
    difficulty: [intermediate]
  - id: decimal_quantize
    text: "Use `decimal:quantize(x, y)` (the IEEE quantize operation) to get a value equal to `x` (apart from rounding) with the exponent of `y`, e.g. to fix a decimal to two fraction digits, and contrast `decimal:round` with fractionDigits 0 with IEEE roundToIntegralTiesToEven, which keeps a positive exponent"
    difficulty: [advanced]
  - id: float_math
    text: "Use the float maths functions that correspond to IEEE operations: `sqrt`, `cbrt`, `pow(x, y)`, `log`, `log10`, `exp`, `sin`, `cos`, `tan`, `asin`, `acos`, `atan`, `atan2(y, x)`, `sinh`, `cosh` and `tanh` (results in radians where relevant)"
    difficulty: [beginner, intermediate]
  - id: number_from_string
    text: "Parse numbers with `float:fromString` (DecimalFloatingPointNumber syntax with an optional sign, also `NaN` and `Infinity` with an optional sign, no `f`/`d` suffix) and `decimal:fromString` (optional sign, no suffix, no NaN or Infinity), both returning `T|error`"
    difficulty: [intermediate]
  - id: float_hex
    text: "Use `float:toHexString` (HexFloatingPointLiteral form with `0x` for finite values, a `-` sign when negative, and `Infinity`, `-Infinity` and `NaN` for the special values) and `float:fromHexString`"
    difficulty: [advanced]
  - id: float_bits
    text: "Use `toBitsInt` and `float:fromBitsInt` to convert between a float and its IEEE 64-bit binary representation as an int, knowing that every NaN bit pattern maps to the single float NaN value"
    difficulty: [advanced]
  - id: float_fixed_exp
    text: "Format floats with `toFixedString(fractionDigits)` (no exponent) and `toExpString(fractionDigits)` (one digit before the point and a lower-case `e` exponent with a sign and at least two digits), where `()` means the minimum digits needed, 0 means no decimal point, rounding is ties-to-even, NaN and infinities format as `value:toString` does, and a negative fractionDigits panics"
    difficulty: [intermediate, advanced]
out_of_scope:
  - "Numeric types, literals, ranges and NumericConvert (concept.numeric_types)"
  - "Arithmetic operators and overflow (concept.arithmetic_operators)"
  - "value:toString formatting of numbers (concept.string_conversion)"
edges:
  - {to: concept.numeric_types, rel: requires}
  - {to: concept.langlib, rel: part_of}
  - {to: concept.string_conversion, rel: uses, via: [int_parse_format, number_from_string, float_fixed_exp]}
  - {to: concept.loops, rel: uses, via: [int_range]}
notes: "Spec doc-comment issues: lang.int Signed16/Signed8 comments say 'non-negative' but give signed ranges; `int:max` and `int:avg` return docs mention `x`/`xs` and 'minimum value' (copy-paste errors); float `ceiling`'s return doc says 'decimal value'. The `2.5.round()` example is derived from the stated ties-to-even rule, not quoted from the spec. The spec does not say what `round` does with a negative fractionDigits."
