  - {to: concept.natural_expressions, rel: uses, via: [u13_natural_expressions, u13_compile_time_codegen]}
  - {to: lib.lang.array, rel: uses, via: [u10_tuple_langlib]}
  - {to: tool.config_toml, rel: uses, via: [u9_config_env, u12_changes]}
  - {to: lib.data.jsondata, rel: uses, via: [u9_libraries]}
  - {to: lib.data.xmldata, rel: uses, via: [u9_libraries, u10_changes]}
  - {to: lib.data.yaml, rel: uses, via: [u10_changes, u14_breaking]}
  - {to: lib.crypto, rel: uses, via: [u11_changes]}
  - {to: lib.http, rel: uses, via: [u10_changes, u11_changes, u12_changes, u14_changes]}
  - {to: lib.soap, rel: uses, via: [u9_libraries]}
  - {to: lib.uuid, rel: uses, via: [u9_libraries]}
  - {to: lib.workflow, rel: uses, via: [u14_changes]}
  - {to: lib.test, rel: uses, via: [u9_tools]}
  - {to: tool.bal_openapi, rel: uses, via: [u9_tools, u10_changes]}
  - {to: tool.bal_persist, rel: uses, via: [u9_tools]}
  - {to: tool.bal_wsdl, rel: uses, via: [u11_changes]}
  - {to: tool.bal_xsd, rel: uses, via: [u11_changes]}
  - {to: tool.packages, rel: uses, via: [u13_changes, u10_changes]}
  - {to: lib.jballerina.java, rel: uses, via: [u11_java21]}
