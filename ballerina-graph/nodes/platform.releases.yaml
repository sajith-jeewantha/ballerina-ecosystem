  - {to: platform.specifications, rel: related, via: [u9_worker_messages, u13_natural_expressions]}
notes: "Update 9's worker-messaging features and Update 11's XML step extensions are part of the 2024R1 spec (implemented in those updates). The only language features beyond 2024R1 in the release notes are the experimental natural expressions, const natural expressions and @natural:code functions (Update 13); the tuple langlib operations (Update 10) are a runtime change. Updates 12 and 14 list no language features; patch releases (9.x to 14.x) list only bug-fix milestones, apart from the experimental `bal wsdl` tool in 2201.9.2."
