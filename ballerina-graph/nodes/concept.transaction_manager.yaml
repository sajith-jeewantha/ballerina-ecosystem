schema_version: "0.1"
id: concept.transaction_manager
type: concept
title: Transaction manager
summary: The abstract transaction manager behind Ballerina transactions, covering global transactions and branches, the per-strand transaction stack, and the Begin, Commit (two-phase commit) and Rollback operations.
priority: long_tail
status: draft
sources:
  - {url: "https://ballerina.io/spec/lang/2024R1/#transactions", kind: spec, note: "7.24 Transactions"}
  - {url: "https://ballerina.io/spec/lang/2024R1/#section_7.24.1", kind: spec, note: "7.24.1 Transaction manager"}
  - {url: "https://ballerina.io/spec/lang/2024R1/#section_7.24.1.1", kind: spec, note: "7.24.1.1 Begin operation"}
  - {url: "https://ballerina.io/spec/lang/2024R1/#section_7.24.1.2", kind: spec, note: "7.24.1.2 Commit operation"}
  - {url: "https://ballerina.io/spec/lang/2024R1/#section_7.24.1.3", kind: spec, note: "7.24.1.3 Rollback operation"}
must_cover:
  - id: global_transactions
    text: "Explain global transactions: one or more transaction branches, each the work of a single strand, with each branch identified by an XID combining the global transaction id and a branch id"
    difficulty: [advanced]
  - id: transaction_stack
    text: "Explain that each strand has a transaction stack, that the strand is in transaction mode when the stack is non-empty, and that the top entry is its current transaction branch"
    difficulty: [advanced]
  - id: begin_operation
    text: "Describe the Begin operation: it starts a global transaction, pushes its initiating branch onto the strand's stack, and optionally receives information about previous attempts in a retry sequence"
    difficulty: [advanced]
  - id: commit_operation
    text: "Describe the Commit operation: it pops the branch and starts a commit, running two-phase commit (prepare, then decide) and deciding to roll back with a cause error if any participant cannot commit or does not respond"
    difficulty: [advanced]
  - id: handler_invocation
    text: "Explain that once the manager decides, it calls the registered commit handlers or rollback handlers (passing the rollback cause) for its branches, tells the participants, and Commit returns the rollback error or nil"
    difficulty: [advanced]
  - id: rollback_operation
    text: "Describe the Rollback operation: it pops the branch and calls the rollback handlers, passing them the given error or nil"
    difficulty: [advanced]
  - id: retry_manager_in_operations
    text: "Explain that for retry transactions Commit and Rollback receive the RetryManager, call its `shouldRetry`, record the result, and pass it to rollback handlers as `willRetry`"
    difficulty: [advanced]
  - id: distributed_transactions
    text: "Explain cross-program transactions: transaction managers coordinate over a network protocol, listeners join service remote or resource methods to the global transaction (and do not call a `transactional` method unless they can), and transactional client remote methods propagate the transaction to the recipient"
    difficulty: [advanced]
  - id: manager_location
    text: "Know that the transaction manager may run in the same process or a separate one, but should not be connected to the program over an unreliable network"
    difficulty: [advanced]
out_of_scope:
  - "Transaction statement syntax and lang.transaction functions (concept.transactions)"
edges:
  - {to: concept.transactions, rel: part_of}
  - {to: concept.retry, rel: uses, via: [retry_manager_in_operations], target_items: [retry_manager_type]}
notes: "7.24.1.3 says the Rollback operation 'initiates a commit of the global transaction', which looks like a typo for 'rollback'; the item describes it as rollback."
