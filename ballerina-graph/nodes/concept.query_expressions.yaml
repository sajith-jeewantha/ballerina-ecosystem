schema_version: "0.1"
id: concept.query_expressions
type: concept
title: Query expressions
summary: Language-integrated, SQL-like queries built from from, where, let, limit, order by and select clauses that produce lists, maps, tables, strings, xml or streams, plus query actions with a do clause.
priority: core
status: draft
sources:
  - {url: "https://ballerina.io/spec/lang/2024R1/#section_6.35", kind: spec, note: "6.35 Query expression"}
  - {url: "https://ballerina.io/spec/lang/2024R1/#section_6.35.1", kind: spec, note: "6.35.1 From clause"}
  - {url: "https://ballerina.io/spec/lang/2024R1/#section_6.35.2", kind: spec, note: "6.35.2 Where clause"}
  - {url: "https://ballerina.io/spec/lang/2024R1/#section_6.35.3", kind: spec, note: "6.35.3 Let clause"}
  - {url: "https://ballerina.io/spec/lang/2024R1/#section_6.35.5", kind: spec, note: "6.35.5 Limit clause"}
  - {url: "https://ballerina.io/spec/lang/2024R1/#section_6.35.6", kind: spec, note: "6.35.6 Order by clause"}
  - {url: "https://ballerina.io/spec/lang/2024R1/#section_6.35.10", kind: spec, note: "6.35.10 Select clause"}
must_cover:
  - id: query_basics
    text: 'Write query expressions such as `from var p in people where p.age > 18 select p.name`, and explain them as a pipeline of clauses transforming a sequence of frames (variable bindings)'
    difficulty: [beginner]
  - id: from_clause
    text: 'Use `from` with a typed binding pattern or `var` over any iterable value, and use several `from` clauses to iterate over every combination of their values'
    difficulty: [beginner, intermediate]
  - id: where_clause
    text: 'Filter frames with `where`, whose boolean condition also narrows variable types for all following clauses'
    difficulty: [beginner]
    sources:
      - {url: "https://ballerina.io/spec/lang/2024R1/#conditional_variable_type_narrowing", kind: spec, note: "7.12 Conditional variable type narrowing"}
  - id: let_clause
    text: 'Add computed bindings with `let int total = p.price * p.qty`, where a let clause with several declarations behaves like consecutive let clauses'
    difficulty: [beginner]
  - id: select_clause
    text: 'Use `select expr` to emit one value per frame, which becomes a member of the constructed result'
    difficulty: [beginner]
  - id: result_kinds
    text: 'Construct lists, maps (with `map from ... select [key, value]`), keyed tables (`table key(id) from ...`), strings (concatenating string results), xml (concatenating xml results) and streams from a query'
    difficulty: [intermediate]
  - id: result_type_selection
    text: 'Explain how the result basic type is chosen: an explicit `map`, `table key(...)` or `stream` keyword first, then the applicable contextually expected type, then the basic type of the first `in` expression (which must be a list, table, string, stream or xml), so a query over a stream yields a stream without the `stream` keyword'
    difficulty: [intermediate, advanced]
  - id: eager_vs_lazy
    text: 'Explain that queries constructing streams run lazily, with clauses executed as `next` is called, while all other queries run eagerly during evaluation'
    difficulty: [intermediate]
  - id: early_error_completion
    text: 'Explain that when an iterator in `from` returns an error, the query stops and that error becomes the result (eager), or is returned by the stream `next` call (lazy), where check-failures are also returned and panics still panic'
    difficulty: [advanced]
  - id: limit_clause
    text: 'Limit the number of frames with `limit n`, where `n` is an `int` evaluated without the frame bindings and a negative value panics'
    difficulty: [intermediate]
  - id: order_by_clause
    text: 'Sort frames with `order by e1 ascending, e2 descending` (ascending by default), where keys must be of ordered types, the sort is stable, and both `()` and NaN sort to the end in either direction'
    difficulty: [intermediate, advanced]
  - id: readonly_results
    text: 'Explain that a query building a list, mapping, table or xml value constructs a read-only value when the applicable expected type is a subtype of `readonly`'
    difficulty: [advanced]
  - id: final_variables
    text: 'Explain that variables bound by query clauses are implicitly final and cannot be assigned'
    difficulty: [beginner]
  - id: query_action
    text: 'Use a query action `from var x in xs where ... do { ... }` to run a statement block for each frame, which evaluates to nil, or to an error if a clause completes early with an error'
    difficulty: [beginner, intermediate]
    sources:
      - {url: "https://ballerina.io/spec/lang/2024R1/#section_7.10", kind: spec, note: "7.10 Query action"}
  - id: actions_in_queries
    text: 'Use actions such as client remote method calls inside query clauses (the `in` expression of from and join, let, select and collect), which makes the whole query an action'
    difficulty: [advanced]
    sources:
      - {url: "https://ballerina.io/spec/lang/2024R1/#section_7.1", kind: spec, note: "7.1 Actions"}
  - id: contextual_keywords
    text: 'Explain that clause keywords marked not-reserved in the grammar (such as `where`, `select`, `limit`, `order`, `by`, `join`, `outer`, `group`, `collect`, `conflict`) can still be used as identifiers'
    difficulty: [advanced]
out_of_scope:
  - "join, group by, collect, aggregated variables and on conflict (concept.query_joins_grouping)"
  - "The Compare operations behind ordering (concept.comparison_equality)"
edges:
  - {to: concept.iterability, rel: requires}
  - {to: concept.binding_patterns, rel: requires}
  - {to: concept.comparison_equality, rel: uses, via: [order_by_clause]}
  - {to: concept.type_narrowing, rel: uses, via: [where_clause]}
  - {to: concept.client_objects, rel: uses, via: [actions_in_queries]}
  - {to: concept.maps, rel: uses, via: [result_kinds], target_items: [map_type]}
notes: "2024R1 (B.1) allows a query-select-expr to construct a stream without the `stream` keyword. 6.35.10 says a mapping-constructing query must specify `map`. Order-by stability follows from the index tie-break in the CompareKL definition."
