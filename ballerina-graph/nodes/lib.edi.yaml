schema_version: "0.1"
id: lib.edi
type: library
title: ballerina/edi
summary: The `edi` module provides schema-driven, envelope-aware conversion between X12 or EDIFACT EDI text and JSON or typed records, schema-free envelope header inspection, and is the runtime behind parsers generated by the `bal edi` tool and the prebuilt `ballerinax/edifact.d03a.*` packages.
priority: long_tail
status: draft
modules: [ballerina/edi]
sources:
  - {url: "https://central.ballerina.io/ballerina/edi/latest", kind: central, note: "ballerina/edi 1.7.1 package docs"}
  - {url: "https://github.com/ballerina-platform/module-ballerina-edi/blob/main/ballerina/README.md", kind: github, note: "Module README"}
  - {url: "https://github.com/ballerina-platform/module-ballerina-edi/blob/main/docs/spec/spec.md", kind: github, note: "EDI specification: envelopes, errors, schema grammar"}
must_cover:
  - id: x12_headers
    text: "Read X12 envelope headers without a schema with `edi:x12HeadersFromEdiString` (or `edi:x12HeadersFromEdiFile`), getting an `edi:X12Headers` with the `isa` segment (`senderId`, `receiverId`, `controlNumber`) and an optional `gs` (`edi:X12GS?`)"
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/learn/by-example/edi-envelope-headers/", kind: bbe}
  - id: edifact_headers
    text: "Read EDIFACT envelope headers without a schema with `edi:edifactHeadersFromEdiString` (or `edi:edifactHeadersFromEdiFile`), getting `unb` (sender, recipient, `controlRef`) and an optional `unh` with its `messageIdentifier`"
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/learn/by-example/edi-envelope-headers/", kind: bbe}
  - id: route_by_partner
    text: "Route inbound EDI messages by trading partner or message type using the schema-free header functions before any full parse"
    difficulty: [intermediate, advanced]
  - id: prebuilt_edifact
    text: "Parse a UN/EDIFACT D03A message into a typed record with a prebuilt package, e.g. `import ballerinax/edifact.d03a.supplychain.mORDERS;` and `mORDERS:EDI_ORDERS_ORDERS po = check mORDERS:fromEdiString(text);`"
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/learn/by-example/edi-to-record/", kind: bbe}
  - id: record_to_edi
    text: "Build a typed EDI record and serialize it to EDI text with the generated `toEdiString` function, e.g. `mORDERS:toEdiString(purchaseOrder)`"
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/learn/by-example/record-to-edi/", kind: bbe}
  - id: interchange_parsing
    text: "Parse a full interchange with `interchangeFromEdiString` into typed interchange records and iterate its `transactions`, where each `body` is `T|error` so failed messages can be quarantined while the rest are processed"
    difficulty: [advanced]
    sources:
      - {url: "https://ballerina.io/learn/by-example/edi-interchange-parsing/", kind: bbe}
  - id: interchange_serialize
    text: "Serialize a full interchange back to EDI text with `interchangeToEdiString`, which recomputes envelope counts"
    difficulty: [advanced]
  - id: generate_parser
    text: "Generate typed records and parser functions from a schema with the EDI tool: `bal tool pull edi`, `bal edi convertEdifactSchema` or `bal edi convertX12Schema` to obtain a JSON schema, then `bal edi codegen -i schema.json -o orders.bal`"
    difficulty: [intermediate]
  - id: low_level_json
    text: "Use the low-level API directly: load a JSON EDI schema with `edi:getSchema`, parse a transaction body to `json` with `edi:fromEdiString(text, schema)` and serialize with `edi:toEdiString(json, schema)`"
    difficulty: [advanced]
  - id: schema_headers
    text: "Parse only the envelope headers against a schema with `edi:headersFromEdiString` or `edi:headersFromEdiFile`, and parse the envelope hierarchy into `edi:EdiInterchange`, `edi:EdiFunctionalGroup` and `edi:EdiTransaction` with `edi:interchangeFromEdiString`"
    difficulty: [advanced]
  - id: custom_schema
    text: "Define or adapt a JSON EDI schema for a partner-specific format with `name`, `delimiters` (`segment`, `field`, `component`, `repetition`), `segments` with `code`, `tag`, `minOccurances`/`maxOccurances` and typed `fields`, plus `ignoreSegments`"
    difficulty: [advanced]
  - id: edi_errors
    text: "Handle `edi:Error` and its subtypes `edi:InvalidEnvelopeError`, `edi:SchemaCompatibilityError` and `edi:SerializationError`"
    difficulty: [intermediate]
    sources:
      - {url: "https://github.com/ballerina-platform/module-ballerina-edi/blob/main/ballerina/edi_translator.bal", kind: github}
out_of_scope:
  - "Full command reference of the EDI CLI tool, including libgen (tool.bal_edi)"
  - "Sending the parsed transactions to brokers such as Kafka (lib.kafka)"
edges:
  - {to: concept.records, rel: uses, via: [prebuilt_edifact, record_to_edi, interchange_parsing]}
  - {to: concept.json_anydata, rel: uses, via: [low_level_json, custom_schema]}
  - {to: concept.union_intersection_types, rel: uses, via: [interchange_parsing, x12_headers]}
  - {to: concept.type_cast_test, rel: uses, via: [interchange_parsing, x12_headers]}
  - {to: concept.errors, rel: uses, via: [edi_errors, interchange_parsing]}
  - {to: concept.modules_imports, rel: uses, via: [prebuilt_edifact]}
  - {to: tool.bal_edi, rel: uses, via: [generate_parser]}
  - {to: lib.io, rel: uses, via: [prebuilt_edifact, interchange_parsing], target_items: [file_string]}
notes: "Verified against module-ballerina-edi master 1.7.1 (= latest tag) and the four EDI BBEs. The prebuilt `ballerinax/edifact.d03a.*` packages are covered here only as consumers of this module; their generated type names follow the BBEs."
