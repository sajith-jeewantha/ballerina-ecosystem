schema_version: "0.2"
id: lib.websub
type: library
title: "ballerina/websub, ballerina/websubhub"
summary: "The WebSub library implements the W3C WebSub subscriber role as a `websub:Listener` service that subscribes to a hub topic, verifies intent and receives content distribution (webhook) notifications. The WebSubHub library implements the WebSub hub role as a `websubhub:Service` on a `websubhub:Listener`, plus a `websubhub:HubClient` for delivering content to subscribers and a `websubhub:PublisherClient` for registering topics and publishing updates."
priority: long_tail
status: draft
modules: [ballerina/websub, ballerina/websubhub]
sources:
  - {url: "https://central.ballerina.io/ballerina/websub/latest", kind: central}
  - {url: "https://github.com/ballerina-platform/module-ballerina-websub/blob/master/ballerina/README.md", kind: github, note: "Module README"}
  - {url: "https://ballerina.io/learn/by-example/websub-webhook-sample/", kind: bbe}
  - {url: "https://github.com/ballerina-platform/module-ballerina-websub/blob/master/docs/spec/spec.md", kind: github, note: "WebSub library specification"}
  - {url: "https://central.ballerina.io/ballerina/websubhub/latest", kind: central}
  - {url: "https://github.com/ballerina-platform/module-ballerina-websubhub/blob/main/ballerina/README.md", kind: github, note: "Module README"}
  - {url: "https://github.com/ballerina-platform/module-ballerina-websubhub/blob/main/docs/spec/spec.md", kind: github, note: "WebSubHub library specification"}
must_cover:
  - id: subscriber_service
    text: "Write a subscriber with `@websub:SubscriberServiceConfig {target: [\"<HUB_URL>\", \"<TOPIC_URL>\"], leaseSeconds: 36000}` on `service /subscriber on new websub:Listener(9090)`, implementing `remote function onEventNotification(websub:ContentDistributionMessage event)` that returns `websub:ACKNOWLEDGEMENT`"
    difficulty: [beginner, intermediate]
  - id: verification_callbacks
    text: "Implement the optional callbacks `onSubscriptionVerification` (returning `websub:SUBSCRIPTION_VERIFICATION_SUCCESS` or an error), `onUnsubscriptionVerification` (`websub:UNSUBSCRIPTION_VERIFICATION_SUCCESS`) and `onSubscriptionValidationDenied(websub:SubscriptionDeniedError)`"
    difficulty: [intermediate]
  - id: resource_discovery
    text: "Let the subscriber discover the hub and topic by giving a single resource URL as `target: \"RESOURCE_URL\"` in `@websub:SubscriberServiceConfig`"
    difficulty: [intermediate]
  - id: callback_url
    text: "Omit the service path to let the listener generate one, and set a public `callback` URL (e.g. an ngrok URL) with `appendServicePath: true` when the subscriber runs behind a tunnel"
    difficulty: [intermediate]
  - id: webhook_content
    text: "Use a WebSub subscriber as a webhook receiver (e.g. for GitHub) by setting `secret` for authenticated content distribution and `httpConfig: {auth: {token: ...}}`, and read the payload from `event.content` with `ensureType()` into `json` or a record"
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/learn/by-example/websub-webhook-sample/", kind: bbe}
  - id: unsubscribe_on_shutdown
    text: "Unsubscribe automatically on shutdown with `unsubscribeOnShutdown: true` together with `websub:ListenerConfiguration {gracefulShutdownPeriod: 15}`"
    difficulty: [intermediate]
  - id: error_returns
    text: "Return `error` from subscriber remote methods and know how each is interpreted (verification failure for the verification callbacks, still acknowledged for `onEventNotification`), and return `websub:SubscriptionDeletedError` from `onEventNotification` when the subscriber no longer needs updates (sent as 410 Gone)"
    difficulty: [advanced]
  - id: hub_listener
    text: "Create a `websubhub:Listener` from a port or an `http:Listener` and attach a hub service declaratively (`service /hub on new websubhub:Listener(9090)`) or programmatically with `attach`, `'start` and `gracefulStop`"
    difficulty: [intermediate]
  - id: topic_registration
    text: "Implement `remote function onRegisterTopic(websubhub:TopicRegistration msg)` and `onDeregisterTopic(websubhub:TopicDeregistration msg)` returning `websubhub:TOPIC_REGISTRATION_SUCCESS`/`websubhub:TOPIC_REGISTRATION_ERROR` and the deregistration counterparts"
    difficulty: [intermediate]
  - id: update_message
    text: "Accept publisher content updates in `remote function onUpdateMessage(websubhub:UpdateMessage msg)` returning `websubhub:ACKNOWLEDGEMENT` or `websubhub:UPDATE_MESSAGE_ERROR`"
    difficulty: [intermediate]
  - id: subscription_flow
    text: "Handle subscriptions with `onSubscription(websubhub:Subscription msg)` (returning `websubhub:SUBSCRIPTION_ACCEPTED` or `websubhub:BAD_SUBSCRIPTION_ERROR`), `onSubscriptionValidation` (returning `websubhub:SUBSCRIPTION_DENIED_ERROR` to reject) and `onSubscriptionIntentVerified(websubhub:VerifiedSubscription msg)`, plus the matching `onUnsubscription*` methods"
    difficulty: [advanced]
  - id: service_config
    text: "Configure the hub with `@websubhub:ServiceConfig {leaseSeconds, webHookConfig, autoVerifySubscriptionIntent}` and, with auto-verification on, take a `websubhub:Controller` parameter in `onSubscription` to call `markAsVerified()`"
    difficulty: [advanced]
  - id: hub_client
    text: "Deliver content to a verified subscriber by creating `websubhub:HubClient` from the subscription message (`check new (msg)`) and calling `notifyContentDistribution({content: ...})`"
    difficulty: [advanced]
  - id: publisher_client
    text: "Act as a publisher with `websubhub:PublisherClient` created from the hub URL, calling `registerTopic(topic)`, `deregisterTopic(topic)`, `publishUpdate(topic, payload)` and `notifyUpdate(topic)`"
    difficulty: [intermediate]
  - id: websubhub_error_returns
    text: "Return `error` from hub remote methods and know the meaning for each (e.g. topic registration failure for `onRegisterTopic`, internal server error for `onSubscription`, validation failure for `onSubscriptionValidation`)"
    difficulty: [advanced]
out_of_scope:
  - "HTTP client configuration details (lib.http)"
  - "Underlying HTTP client settings reused by `websubhub:ClientConfiguration` (lib.http)"
edges:
  - {to: concept.services_listeners, rel: requires}
  - {to: concept.annotations, rel: uses, via: [subscriber_service, resource_discovery, callback_url, service_config]}
  - {to: concept.errors, rel: uses, via: [error_returns, verification_callbacks, websubhub_error_returns, topic_registration]}
  - {to: concept.json_anydata, rel: uses, via: [webhook_content]}
  - {to: lib.http, rel: uses, via: [webhook_content, hub_listener, hub_client], target_items: [client_auth, client_resiliency]}
  - {to: concept.client_objects, rel: uses, via: [hub_client, publisher_client]}
notes: "Items come from the module README and the single WebSub BBE (websub 2.x). The README's HubClient sample types `onSubscriptionIntentVerified` with `websubhub:Subscription`, while the spec's service type uses `websubhub:VerifiedSubscription`; items follow the spec. Spec section 2.2.2.3 is headed `onEventMessage` but the service type and README use `onUpdateMessage`."
