schema_version: "0.1"
id: concept.constants_enums
type: concept
title: Constants and enums
summary: Compile-time constants declared with const, the constant expressions that initialize them, and enum declarations as unions of string constants.
priority: core
status: draft
sources:
  - {url: "https://ballerina.io/spec/lang/2024R1/#section_8.8", kind: spec, note: "8.8 Module constant declaration"}
  - {url: "https://ballerina.io/spec/lang/2024R1/#section_6.4", kind: spec, note: "6.4 Constant expressions"}
  - {url: "https://ballerina.io/spec/lang/2024R1/#section_8.9", kind: spec, note: "8.9 Module enumeration declaration"}
must_cover:
  - id: const_decl
    text: "Declare module constants with `const MAX = 10;` or `public const string GREETING = \"hi\";`, naming immutable values known at compile time"
    difficulty: [beginner]
  - id: const_type
    text: "Explain that a constant's type is the intersection of `readonly` and the singleton type of its value, so an explicit type descriptor only supplies the contextually expected type and an upper bound; it must be a subtype of `anydata` and not `never`, and the const-expr's static type must be a subtype of it"
    difficulty: [intermediate, advanced]
  - id: const_in_types
    text: "Use constants where compile-time values are required: as singleton types in type descriptors (e.g. `type Mode READ|WRITE;`), as array lengths such as `int[N]`, and in match patterns"
    difficulty: [intermediate]
  - id: const_expr_forms
    text: "Write constant expressions from literals, template expressions, list/mapping/table constructors, references to other constants, type casts, `is` tests, and unary, arithmetic, relational, equality, logical and conditional operators, where every nested expression must itself be a const-expr"
    difficulty: [intermediate]
  - id: const_reference
    text: "Know that a constant reference inside a const-expr must refer to a constant defined with a module `const` declaration"
    difficulty: [intermediate]
  - id: const_compile_time
    text: "Explain that a const-expr is evaluated at compile time, that constructors within it build values with the read-only bit set so the result is always immutable, and that a const-expr cannot construct an error value"
    difficulty: [intermediate]
  - id: structured_consts
    text: "Declare structured constants such as `const map<int> LIMITS = {low: 1, high: 9};` or `const int[] PRIMES = [2, 3, 5];`, whose values are immutable"
    difficulty: [intermediate]
  - id: simple_const_expr
    text: "Distinguish `simple-const-expr` (nil, boolean, optionally signed numeric literals, string literals and constant references), which is used for singleton types, const match patterns and xmlns namespace URIs, from a full const-expr"
    difficulty: [advanced]
    sources:
      - {url: "https://ballerina.io/spec/lang/2024R1/#section_5.6.2", kind: spec, note: "5.6.2 Singleton types"}
  - id: enum_decl
    text: "Declare enums such as `enum Color { RED, GREEN, BLUE }`, where each member becomes a string constant whose value defaults to its own name and the enum name becomes a type that is the union of the member constants"
    difficulty: [beginner]
  - id: enum_values
    text: "Give enum members explicit values such as `RED = \"red\"`, knowing the const-expr must evaluate to a string"
    difficulty: [beginner, intermediate]
  - id: enum_equivalence
    text: "Explain that `public enum Color { RED, GREEN, BLUE }` is exactly equivalent to `public const RED = \"RED\";` (and so on) plus `public type Color RED|GREEN|BLUE;`, so a public enum makes both the type and the constants public"
    difficulty: [intermediate]
out_of_scope:
  - "Singleton and union types in general (concept.union_intersection_types)"
  - "Const match patterns (concept.match_statement)"
  - "Read-only values in general (concept.mutability_readonly)"
edges:
  - {to: concept.variables, rel: requires}
  - {to: concept.union_intersection_types, rel: requires}
  - {to: concept.match_statement, rel: uses, via: [const_in_types, simple_const_expr]}
  - {to: concept.mutability_readonly, rel: uses, via: [const_compile_time, const_type]}
  - {to: concept.arrays_tuples, rel: uses, via: [const_in_types]}
notes: "Section 6.4 lists the syntactic forms of const-expr; the spec does not enumerate which operators are allowed inside nil-lifted-expr beyond the grammar, so items follow the grammar list."
