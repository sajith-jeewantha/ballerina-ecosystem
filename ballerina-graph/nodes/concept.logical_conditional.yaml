schema_version: "0.1"
id: concept.logical_conditional
type: concept
title: Logical expressions
summary: The boolean operators `!`, `&&` and `||` with short-circuit evaluation, the ternary conditional `? :` and the nil-conditional (Elvis) operator `?:`.
priority: core
status: draft
sources:
  - {url: "https://ballerina.io/spec/lang/2024R1/#section_6.22.2", kind: spec, note: "6.22.2 Unary logical expression"}
  - {url: "https://ballerina.io/spec/lang/2024R1/#section_6.31", kind: spec, note: "6.31 Logical expression"}
  - {url: "https://ballerina.io/spec/lang/2024R1/#section_6.32", kind: spec, note: "6.32 Conditional expression"}
must_cover:
  - id: logical_not
    text: 'Use `!` on a boolean operand to negate it, with result type boolean (singleton when the operand is singleton)'
    difficulty: [beginner]
  - id: logical_and_or
    text: 'Combine boolean expressions with `&&` and `||`, whose operands must be subtypes of boolean'
    difficulty: [beginner]
  - id: short_circuit
    text: 'Explain short-circuit evaluation, that the right operand of `&&` is not evaluated when the left is false and the right operand of `||` is not evaluated when the left is true'
    difficulty: [beginner, intermediate]
  - id: logical_singleton_types
    text: 'Explain that `&&` with a left operand of singleton type `false` has static type `false`, and `||` with a left operand of singleton type `true` has static type `true`, regardless of the right operand'
    difficulty: [advanced]
  - id: ternary
    text: 'Use the ternary conditional `cond ? a : b`, where cond must be boolean and only the selected branch is evaluated'
    difficulty: [beginner]
  - id: ternary_static_type
    text: 'Explain that the ternary''s static type is the union of both branch types, or just one branch''s type when the condition has singleton type `true` or `false`'
    difficulty: [intermediate]
  - id: elvis
    text: 'Use the nil-conditional operator `x ?: d` to supply a default when x evaluates to nil, with the right operand evaluated only when needed'
    difficulty: [beginner]
  - id: elvis_static_type
    text: 'Explain that `L ?: R` has static type R when L''s type is nil, L''s type when it cannot be nil, and otherwise the union of L''s type without nil and R''s type'
    difficulty: [intermediate]
  - id: right_associativity
    text: 'Explain that `?:` and `? :` are right-associative and bind more loosely than `||`, so `a ?: b ?: c` is `a ?: (b ?: c)`'
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/spec/lang/2024R1/#expressions", kind: spec, note: "6 Expressions precedence table"}
out_of_scope:
  - "Narrowing of variables inside `&&`, `||` and `? :` (concept.type_narrowing)"
  - "Bitwise operators `&`, `|`, `^` (concept.arithmetic_operators)"
edges:
  - {to: concept.expression_typing, rel: requires}
  - {to: concept.basic_types, rel: requires}
