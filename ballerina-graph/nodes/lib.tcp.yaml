schema_version: "0.2"
id: lib.tcp
type: library
title: "ballerina/tcp, ballerina/udp"
summary: "The TCP library provides a connection-oriented `tcp:Client` for sending and receiving bytes and a `tcp:Listener` whose service returns a `tcp:ConnectionService` per client connection, with optional TLS. The UDP library sends and receives datagrams with a connectionless `udp:Client`, a peer-bound `udp:ConnectClient`, and a `udp:Listener` service with `onDatagram`/`onBytes` callbacks."
priority: long_tail
status: draft
modules: [ballerina/tcp, ballerina/udp]
sources:
  - {url: "https://central.ballerina.io/ballerina/tcp/latest", kind: central}
  - {url: "https://github.com/ballerina-platform/module-ballerina-tcp/blob/master/ballerina/README.md", kind: github, note: "Module README"}
  - {url: "https://ballerina.io/learn/by-example/tcp-listener/", kind: bbe}
  - {url: "https://central.ballerina.io/ballerina/udp/latest", kind: central}
  - {url: "https://github.com/ballerina-platform/module-ballerina-udp/blob/master/ballerina/README.md", kind: github, note: "Module README"}
  - {url: "https://ballerina.io/learn/by-example/udp-listener/", kind: bbe}
must_cover:
  - id: client_read_write
    text: "Connect with `tcp:Client socketClient = check new (\"localhost\", 9090)`, send data with `writeBytes(\"Hello\".toBytes())`, read the reply as `readonly & byte[]` with `readBytes()`, convert with `string:fromBytes()`, and `close()` the client"
    difficulty: [beginner]
    sources:
      - {url: "https://ballerina.io/learn/by-example/tcp-client/", kind: bbe}
  - id: listener_on_connect
    text: "Accept connections with `service on new tcp:Listener(9090)` implementing `remote function onConnect(tcp:Caller caller) returns tcp:ConnectionService` and reading connection details such as `caller.remotePort`"
    difficulty: [beginner]
    sources:
      - {url: "https://ballerina.io/learn/by-example/tcp-listener/", kind: bbe}
  - id: connection_service
    text: "Implement a `service class` including `*tcp:ConnectionService` with `remote function onBytes(readonly & byte[] data)` that echoes by returning `byte[]` or writes with `caller->writeBytes(data)`, plus `onError(tcp:Error err)` and `onClose()`"
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/learn/by-example/tcp-listener/", kind: bbe}
  - id: tls
    text: "Secure TCP with `secureSocket`: `key: {certFile, keyFile}` (a `tcp:ListenerSecureSocket`) on the listener and `cert` on the client"
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/learn/by-example/tcp-service-ssl-tls/", kind: bbe}
      - {url: "https://ballerina.io/learn/by-example/tcp-client-ssl-tls/", kind: bbe}
  - id: client_config
    text: "Configure the client with `tcp:ClientConfiguration` fields such as `timeout` and `writeTimeout` (seconds) and handle `tcp:Error` from reads and writes"
    difficulty: [intermediate]
    sources:
      - {url: "https://github.com/ballerina-platform/module-ballerina-tcp/blob/master/ballerina/client.bal", kind: github}
  - id: connectionless_client
    text: "Send and receive datagrams with `udp:Client socketClient = check new;`, building a `udp:Datagram {remoteHost, remotePort, data}` for `sendDatagram()`, reading `readonly & udp:Datagram` with `receiveDatagram()`, and calling `close()`"
    difficulty: [beginner]
    sources:
      - {url: "https://ballerina.io/learn/by-example/udp-client/", kind: bbe}
  - id: connect_client
    text: "Exchange data with a single peer using `udp:ConnectClient` created with `check new (\"localhost\", 9090)` and its `writeBytes()`/`readBytes()` methods, knowing large byte arrays are split across several datagrams"
    difficulty: [beginner]
    sources:
      - {url: "https://ballerina.io/learn/by-example/udp-connect-client/", kind: bbe}
  - id: listener_service
    text: "Handle incoming datagrams with `service on new udp:Listener(9090)` implementing `remote function onDatagram(readonly & udp:Datagram datagram)` (returning a `udp:Datagram` to reply) or `onBytes(readonly & byte[] data, udp:Caller caller)`, plus `onError(udp:Error err)`"
    difficulty: [intermediate]
    sources:
      - {url: "https://ballerina.io/learn/by-example/udp-listener/", kind: bbe}
  - id: caller_reply
    text: "Reply through a `udp:Caller` parameter with `caller->sendBytes(data)` or `caller->sendDatagram(datagram)` and read the peer from `caller.remoteHost`/`caller.remotePort`"
    difficulty: [intermediate]
    sources:
      - {url: "https://github.com/ballerina-platform/module-ballerina-udp/blob/master/ballerina/caller.bal", kind: github}
  - id: configuration
    text: "Configure local binding and timeouts: `localHost` and `timeout` on `udp:ClientConfiguration`/`udp:ConnectClientConfiguration`, and `localHost`, `remoteHost`, `remotePort` on `udp:ListenerConfiguration` to restrict a listener to one peer"
    difficulty: [intermediate]
    sources:
      - {url: "https://github.com/ballerina-platform/module-ballerina-udp/blob/master/ballerina/listener.bal", kind: github}
      - {url: "https://github.com/ballerina-platform/module-ballerina-udp/blob/master/ballerina/connectionless_client.bal", kind: github}
      - {url: "https://github.com/ballerina-platform/module-ballerina-udp/blob/master/ballerina/connect_client.bal", kind: github}
out_of_scope:
  - "Higher-level protocols over TCP such as HTTP (lib.http)"
edges:
  - {to: concept.services_listeners, rel: requires}
  - {to: concept.client_objects, rel: uses, via: [client_read_write, connectionless_client, connect_client]}
  - {to: concept.classes, rel: uses, via: [connection_service]}
  - {to: concept.mutability_readonly, rel: uses, via: [client_read_write, connection_service, connectionless_client, listener_service]}
  - {to: lib.lang.string, rel: uses, via: [client_read_write]}
  - {to: concept.records, rel: uses, via: [connectionless_client, listener_service]}
notes: "Configuration fields confirmed against udp master sources (connect_client.bal, connectionless_client.bal, listener.bal)."
